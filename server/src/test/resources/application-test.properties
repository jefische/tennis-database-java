spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=always

# Dummy values for @Value placeholders that have no default.
# Real values come from .env at runtime; tests only need the context to start.
GOOGLE_API_KEY=test-key
RESEND_API_KEY=test-key
# Must be >= 32 chars: Keys.hmacShaKeyFor rejects keys under 256 bits for HS256
JWT_SECRET=test-jwt-secret-for-local-testing-only-32b